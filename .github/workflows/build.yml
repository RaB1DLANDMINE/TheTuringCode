name: Build APK

on:
  push:
    branches: [ main, feature/debug-keypad-app ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Encrypted Config
        run: dart tool/generate_config.dart

      - name: Create Keystore
        run: |
          keytool -genkey -v -keystore android/app/upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass password -keypass password -dname "CN=Example, OU=Engineering, O=Example, L=City, S=State, C=US"

      - name: Build APK
        run: flutter build apk --release
        env:
          KEYSTORE_PASSWORD: password
          KEY_PASSWORD: password
          KEY_ALIAS: upload
          KEYSTORE_FILE: upload-keystore.jks

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
